        <p class="post-preview">November 3, 2026 <span class="lc-diff easy">Easy</span></p>
        <details>
            <summary><span class="see-more-btn">See more</span></summary>
            <div class="full-content">
                <p class="lc-label">Solution</p>
                <script type="text/plain" class="lc-text">
Core Logic involves to map all posible values of each Roman symbol to it's assigned integer value as provided. (I=1, V=5, X=10, L=50, C=100, D=500, M=1000). This is very simple but a challange is implementing a way to circumbent the 'four' rule.

- Roman numerals are usually written largest to smallest from left to right. However, the numeral for four is not IIII. Instead, the number four is written as IV. 

- Another component to solving it was Normal Addition: If current character's value >= next character's value, add the current value to total.   Subtraction Rule: If current character's value < next character's value, subtract the current value from total. 
                </script>

                <p class="lc-label">Notes</p>

Ultimately chose an algorithm to read and linear serach from right to left to convert the string to integers. Got stuck for an hour on a lot of logical bugs. Will know implement flowchart next solving.
                </script>

        <p class="post-preview">November 3, 2026 <span class="lc-diff easy">Easy</span></p>
        <details>
            <summary><span class="see-more-btn">See more</span></summary>
            <div class="full-content">
                <p class="lc-label">Solution</p>
                <script type="text/plain" class="lc-text">
Problem requires to know that given an integer x, return true if the number is a pallindrome (the same reversed), and false if not. One universal rule is a negative number will always return false. 

-initially thought of a oslution requiring an algorithm to reverse it then compare each number with a corresponding number. but You dont need to reverse it. Once you extract the number in an array, just compare it with a corresponding number on the end. No reversing needed.

-Make use of remainder property of deviding by 10. When getting the remainder of any number when dividing by 10, you get the last digit. 


                </script>
