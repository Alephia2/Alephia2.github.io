    <h3 class="lc-title"><a href="https://leetcode.com/problems/two-sum/" target="_blank">1. Two Sum</a></h3>
    <p class="lc-tags"><span>Array</span><span>Hash Table</span></p>
    <details>
        <summary><span class="see-more-btn">See more</span></summary>
        <div class="full-content">
            <p class="lc-label">How I solved it</p>
            <script type="text/plain" class="lc-text">
Sample notes. Brute force checks every pair, which is O(n^2). Instead I store each number in a dictionary as I go, and for every new number I check if its partner (target - n) was already seen.

Time O(n), space O(n).
            </script>
            <p class="lc-label">Code</p>
            <script type="text/plain" class="lc-code" data-lang="Python">
class Solution:
    def twoSum(self, nums, target):
        seen = {}
        for i, n in enumerate(nums):
            if target - n in seen:
                return [seen[target - n], i]
            seen[n] = i
            </script>

    <p class="lc-tags"><span>Two Pointers</span><span>Greedy</span></p>
    <details>
        <summary><span class="see-more-btn">See more</span></summary>
        <div class="full-content">
            <p class="lc-label">How I solved it</p>
            <script type="text/plain" class="lc-text">
Sample notes. Start with pointers at both ends and always move the shorter wall inward, since the taller one can't do better with a smaller width.
            </script>
            <p class="lc-label">Code</p>
            <script type="text/plain" class="lc-code" data-lang="C++">
class Solution {
public:
    int maxArea(vector<int>& height) {
        int l = 0, r = height.size() - 1, best = 0;
        while (l < r) {
            best = max(best, min(height[l], height[r]) * (r - l));
            if (height[l] < height[r]) l++; else r--;
        }
        return best;
    }
};
            </script>
